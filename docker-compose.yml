services:
  fitforge-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: fitforge-web
    image: fitforge-web:latest
    ports:
      - "${FITFORGE_WEB_PORT:-8080}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
