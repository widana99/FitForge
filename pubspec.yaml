name: fitforge
description: FitForge - Modern Workout & Fitness App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: ^6.2.1

  # State Management
  provider: any

  # UI & Animation
  lottie: any
  fl_chart: any
  smooth_page_indicator: any
  cached_network_image: any
  shimmer: any
  flutter_staggered_animations: any

  # Video
  video_player: any
  chewie: any

  # Media Upload
  image_picker: any
  http: any

  # Notifications
  flutter_local_notifications: any

  # Storage
  shared_preferences: any

  # Utils
  intl: any
  uuid: any
  url_launcher: any
  path_provider: any

  # Fonts
  google_fonts: any

  # Icons
  lucide_icons: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
