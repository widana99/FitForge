# Docker Compose untuk PLAN B: Menarik Image dari Docker Hub Registry
services:
  fitforge-web:
    image: ${DOCKERHUB_USER:-fitforge}/fitforge-web:latest
    container_name: fitforge-web
    ports:
      - "${FITFORGE_WEB_PORT:-8080}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  fitforge-admin:
    image: ${DOCKERHUB_USER:-fitforge}/fitforge-admin:latest
    container_name: fitforge-admin
    ports:
      - "${FITFORGE_ADMIN_PORT:-3000}:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
