server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support WebAssembly and modern web formats
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/javascript js mjs;
    }

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/wasm image/svg+xml;

    # SPA routing fallback: send all unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (fonts, images, icons)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Ensure index.html and flutter bootstrap scripts are never aggressively cached
    location ~* (index\.html|flutter_bootstrap\.js|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
